name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Build native kernels (C++)
        run: bash tool/build_native.sh

      - name: Test
        run: dart test

      - name: Benchmark
        run: dart run bin/benchmark.dart
