name: route_optimizer
description: >-
  Offline, time-dependent route optimisation for multi-drop delivery apps:
  time windows, congestion-aware travel times, Or-opt / 2-opt local search,
  fast dynamic insertion and driver-controlled route changes. Pure Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.3.0

dev_dependencies:
  test: ^1.24.0
